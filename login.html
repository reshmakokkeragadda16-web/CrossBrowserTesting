
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, #3349a8 0, transparent 38%),
                radial-gradient(circle at 85% 80%, #682f9b 0, transparent 38%),
                linear-gradient(135deg, #10152d, #171b38 55%, #101426);
            color: #f8fafc;
        }

        .login-box {
            width: 100%;
            max-width: 410px;
            padding: 42px 36px 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.075);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            animation: appear 0.6s ease-out;
        }

        .brand {
            display: flex;
            justify-content: center;
            margin-bottom: 26px;
        }

        .brand-icon {
            width: 66px;
            height: 66px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #818cf8, #a855f7);
            box-shadow: 0 10px 30px rgba(129, 140, 248, 0.3);
        }

        .brand-icon svg {
            width: 34px;
            height: 34px;
        }

        h1 {
            text-align: center;
            font-size: 29px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 32px;
            text-align: center;
            color: #b7c0da;
            font-size: 14px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #e5e9f8;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            top: 50%;
            left: 15px;
            width: 19px;
            height: 19px;
            transform: translateY(-50%);
            stroke: #9ca8cb;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 51px;
            padding: 0 15px 0 45px;
            border: 1px solid rgba(195, 205, 238, 0.19);
            border-radius: 12px;
            outline: none;
            background: rgba(9, 14, 36, 0.45);
            color: #ffffff;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #818ba9;
        }

        input:focus {
            border-color: #929bff;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }

        button {
            width: 100%;
            min-height: 52px;
            margin-top: 7px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(100deg, #6677ed, #9a5ae8);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(117, 100, 235, 0.24);
            transition: transform 0.2s, filter 0.2s;
        }

        button:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 3px solid #c4b5fd;
            outline-offset: 3px;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
        }

        .footer {
            margin-top: 27px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            color: #8f9aba;
            font-size: 12px;
        }

        .footer span {
            color: #b5a5ff;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 420px) {
            .login-box {
                padding: 34px 23px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="login-box">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="white" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <rect x="4" y="10" width="16" height="11" rx="2"/>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                    <circle cx="12" cy="15" r="1.2"/>
                    <path d="M12 16.2V18"/>
                </svg>
            </div>
        </div>

        <h1>Welcome Back</h1>
        <p class="subtitle">
            Sign in to access your secure portal
        </p>

        <form id="loginForm">
            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                    </svg>
                    <input id="username" name="username"
                           type="text" placeholder="Enter your username"
                           autocomplete="username"
                           aria-label="Username" required>
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="2"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                    </svg>
                    <input id="password" name="password"
                           type="password" placeholder="Enter your password"
                           autocomplete="current-password"
                           aria-label="Password" required>
                </div>
            </div>

            <button id="loginButton" type="submit">
                Sign In &nbsp; →
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <div class="footer">
            Protected access <span>•</span> Cross-Browser Testing Project
        </div>
    </main>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                if (username === "admin" &&
                    password === "admin123") {
                    message.textContent = "Login successful!";
                    message.style.color = "#86efac";
                } else {
                    message.textContent =
                        "Invalid username or password";
                    message.style.color = "#fca5a5";
                }
            });
    </script>
</body>
</html>
